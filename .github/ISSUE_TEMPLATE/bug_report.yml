name: Bug report
description: Report a reproducible NovelForge AI problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, tokens, databases, backups, or private manuscript text.
        Report security vulnerabilities privately through the Security tab.
  - type: input
    id: version
    attributes:
      label: Version
      description: App version or commit SHA
      placeholder: 0.1.109
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - macOS desktop app
        - Local web development
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use sample or redacted content only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      render: shell
